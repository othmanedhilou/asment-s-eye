# Configuration Ciment's Eye — caméras, modèles, ROI

cameras:
  webcam_test:
    # source: indice de webcam locale (0) OU URL RTSP d'une caméra IP du site.
    # Cette machine n'a pas Docker/mediamtx : lecture directe de la webcam.
    source: 0
    rtsp_url: "rtsp://localhost:8554/webcam"
    models:
      - arc
      - conveyor
      - epi
      - fire_smoke
      - gloves_glasses
      - load_control
      - person_animal
      - vehicles
    # les 7 modèles sont chargés ; activer/désactiver détection et alertes
    # se fait en direct depuis le panneau de contrôle (pas ici)

models:
  arc:
    file: models/ciments_eye_arc_best_openvino_model
    conf: 0.4
    enabled: true
  conveyor:
    file: models/ciments_eye_conveyor_best_openvino_model
    conf: 0.4
    enabled: true  # bande transporteuse : classe unique "crack" (fissure/déchirure)
  epi:
    file: models/ciments_eye_epi_best_openvino_model
    conf: 0.4
    enabled: true
  # Détection de personne au sol, modèle dédié. Aujourd'hui la chute est une
  # classe du modèle gloves_glasses, où elle est peu fiable. Passer à false
  # une fois ce modèle entraîné : les alertes basculent automatiquement.
  fall:
    file: models/ciments_eye_fall_best_openvino_model
    conf: 0.4
    enabled: false   # passer à true une fois le modèle entraîné et exporté

  fire_smoke:
    file: models/ciments_eye_fire_smoke_best_openvino_model
    conf: 0.35
    enabled: true
  gloves_glasses:
    file: models/ciments_eye_gloves_glasses_best_openvino_model
    conf: 0.4
    enabled: true
  load_control:
    file: models/ciments_eye_load_control_best_openvino_model
    conf: 0.4
    enabled: true  # faux positifs connus (0.89) -> désactivé PAR DÉFAUT via le panneau (data/settings.json), pas ici
  person_animal:
    file: models/ciments_eye_person_animal_best_openvino_model
    conf: 0.4
    enabled: true
  vehicles:
    file: models/ciments_eye_vehicles_best_openvino_model
    conf: 0.4
    enabled: true

  # Exemple de deuxième caméra (caméra IP du site). Chaque caméra tourne dans
  # son propre thread et peut avoir ses propres modèles et sa propre cadence :
  # sur une machine contrainte, on ralentit une caméra secondaire sans toucher
  # aux autres.
  #
  # quai_chargement:
  #   source: "rtsp://user:motdepasse@192.168.1.42:554/stream1"
  #   models: [vehicles, person_animal, epi]
  #   fps: 2                # surcharge inference.fps pour cette caméra
  #   workers: 2            # threads d'inférence dédiés à cette caméra
  #   tracking: true        # suivi des objets : comptage, sens de passage,
  #                         # et une alerte par personne au lieu d'une par image
  #   recording: true       # enregistrement vidéo continu (gourmand en disque)
  #   segment_minutes: 5    # durée d'un segment d'enregistrement
  #   retention_days: 7     # au-delà, les segments sont purgés
  #   enabled: true         # false met la caméra en pause sans perdre ses zones

  # Les caméras se gèrent normalement depuis l'interface (page Caméras), qui
  # écrit dans config/cameras.json. Ce fichier sert d'amorçage au premier
  # démarrage et de référence pour les modèles.

inference:
  fps: 4          # images analysées par seconde et par caméra (valeur par défaut)
  imgsz: 640      # doit correspondre à la taille figée à l'export OpenVINO
  # workers: 4    # threads d'inférence par caméra ; par défaut = nb de cœurs
